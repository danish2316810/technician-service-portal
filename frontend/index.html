



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="selection-screen" class="container">
        <div class="tile" onclick="showCustomerView()">
            <i class="fas fa-user"></i>
            <h2>Customer Login</h2>
        </div>
                <div class="tile" onclick="showTechnicianView()">
            <i class="fas fa-tools"></i>
            <h2>Technician Login</h2>
        </div>
        <div class="tile tile-blue" onclick="showCreateAccountView()">
            <i class="fas fa-user-plus"></i>
            <h2>Create Account</h2>
        </div>
    </div>

    <div id="detail-view">
        <button class="back-btn" onclick="showSelectionScreen()"><i class="fas fa-arrow-left"></i> Back</button>
        <div id="view-content">
            <!-- Content will be injected here -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
